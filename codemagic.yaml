workflows:
  ios-workflow:
    name: Horizon Credit iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Build unsigned iOS app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/HorizonCredit.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

    artifacts:
      - build/HorizonCredit.xcarchive
